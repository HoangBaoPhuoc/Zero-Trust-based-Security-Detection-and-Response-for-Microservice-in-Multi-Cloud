apiVersion: apps/v1
kind: Deployment
metadata:
  name: opa-server
  namespace: financial
  labels:
    app: opa
    app.kubernetes.io/part-of: ztlab
spec:
  # T-5.4: replicas:1 nghĩa là OPA là điểm chết đơn (F10) — failure_mode_allow:
  # false ở extensionProvider (k8s/istio/istio-operator.yaml) khiến MỌI giao
  # dịch 2 cloud dừng khi pod OPA duy nhất mất, đo thật: xoá pod lúc có tải
  # thật (n=281 request, interval 0.2s) gây đúng 27 request liên tiếp bị 403
  # (fail-closed đúng thiết kế, không phải lỗi) trong ~5.6s trước khi Kubernetes
  # tự thay pod mới và Envoy cập nhật endpoint qua EDS — không cần can thiệp
  # tay. 3 replica + PodDisruptionBudget (minAvailable: 2) dưới đây giảm khả
  # năng xảy ra cửa sổ mất-toàn-bộ này (chỉ còn xảy ra nếu CẢ 3 pod cùng mất
  # đồng thời, hoặc lúc rolling update không tôn trọng PDB).
  replicas: 3
  selector:
    matchLabels:
      app: opa
  template:
    metadata:
      labels:
        app: opa
      annotations:
        sidecar.istio.io/inject: "false"  # PDP for ext_authz, called by other sidecars' filters directly — not in migration scope
    spec:
      serviceAccountName: opa
      containers:
        - name: opa
          # Pinned 2026-09-05 from the digest actually running (was latest-envoy, a floating tag — see KET-QUA-KIEM-TRA.md T-0.5).
          image: openpolicyagent/opa@sha256:1792991ca9646526b8c95c59cbb525ce33bf78458800182d78f6fa884d5ec517
          args:
            - "run"
            - "--server"
            - "--addr=0.0.0.0:8181"
            - "--config-file=/etc/opa/opa-config.yaml"
            - "--ignore=.*"
            - "/policies"
          ports:
            - name: http
              containerPort: 8181
            - name: grpc-authz
              containerPort: 9191
          volumeMounts:
            - name: opa-config
              mountPath: /etc/opa
              readOnly: true
            - name: opa-policies
              mountPath: /policies
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: opa-config
          configMap:
            name: opa-config
        - name: opa-policies
          configMap:
            name: opa-policies
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: opa-server
  namespace: financial
  labels:
    app: opa
    app.kubernetes.io/part-of: ztlab
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: opa
---
apiVersion: v1
kind: Service
metadata:
  name: opa-service
  namespace: financial
  labels:
    app: opa
    app.kubernetes.io/part-of: ztlab
spec:
  type: ClusterIP
  selector:
    app: opa
  ports:
    - name: http
      port: 8181
      targetPort: 8181
    - name: grpc-authz
      port: 9191
      targetPort: 9191
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opa
  namespace: financial
  labels:
    app: opa
    app.kubernetes.io/part-of: ztlab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: opa
  namespace: financial
  labels:
    app: opa
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: opa
  namespace: financial
  labels:
    app: opa
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: opa
subjects:
  - kind: ServiceAccount
    name: opa
    namespace: financial
