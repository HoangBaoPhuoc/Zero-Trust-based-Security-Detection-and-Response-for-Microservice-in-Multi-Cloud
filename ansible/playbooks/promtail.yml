---
- name: Install and configure Promtail on all nodes
  hosts: all
  become: true
  vars:
    promtail_version: "2.9.5"
    promtail_binary_url: "https://github.com/grafana/loki/releases/download/v{{ promtail_version }}/promtail-linux-amd64.zip"
  tasks:
    - name: Create promtail user
      ansible.builtin.user:
        name: promtail
        system: true
        shell: /usr/sbin/nologin
        create_home: false

    - name: Create promtail and log directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: promtail
        group: promtail
        mode: "0755"
      loop:
        - /etc/promtail
        - /var/log/envoy
        - /var/log/opa
        - /tmp/promtail-positions

    - name: Install unzip
      ansible.builtin.apt:
        name: unzip
        state: present
        update_cache: true

    - name: Download Promtail binary archive
      ansible.builtin.get_url:
        url: "{{ promtail_binary_url }}"
        dest: /tmp/promtail-linux-amd64.zip
        mode: "0644"
        timeout: 60
      register: promtail_download
      retries: 3
      delay: 10
      until: promtail_download is succeeded

    - name: Unpack Promtail binary
      ansible.builtin.unarchive:
        src: /tmp/promtail-linux-amd64.zip
        dest: /usr/local/bin
        remote_src: true
        creates: /usr/local/bin/promtail-linux-amd64

    - name: Symlink promtail binary
      ansible.builtin.file:
        src: /usr/local/bin/promtail-linux-amd64
        dest: /usr/local/bin/promtail
        state: link

    - name: Deploy Promtail config
      ansible.builtin.template:
        src: ../templates/promtail-config.yml.j2
        dest: /etc/promtail/config.yml
        owner: promtail
        group: promtail
        mode: "0640"
      notify: restart promtail

    - name: Deploy Promtail systemd unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/promtail.service
        mode: "0644"
        content: |
          [Unit]
          Description=Promtail log shipper
          After=network-online.target
          Wants=network-online.target

          [Service]
          User=promtail
          ExecStart=/usr/local/bin/promtail -config.file=/etc/promtail/config.yml
          Restart=on-failure
          RestartSec=5s
          LimitNOFILE=65536

          [Install]
          WantedBy=multi-user.target
      notify: restart promtail

    - name: Enable and start Promtail
      ansible.builtin.systemd:
        name: promtail
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    - name: restart promtail
      ansible.builtin.systemd:
        name: promtail
        state: restarted
        daemon_reload: true
