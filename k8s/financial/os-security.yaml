apiVersion: v1
kind: ServiceAccount
metadata:
  name: opa
  namespace: financial
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opa-config
  namespace: financial
data:
  opa-config.yaml: |
    plugins:
      envoy_ext_authz_grpc:
        addr: :9191
        path: zta/crosscloud/allow

    decision_logs:
      console: true
---
# opa-policies ConfigMap (cross_cloud.rego, zta_policy.rego, fraud_gate.rego) is
# created by scripts/deploy-security-stack.sh via `kubectl create configmap
# --from-file=opa/policies/` BEFORE this file is applied — that is the single
# source of truth. An embedded copy used to live here too; it went stale
# (missing a live policy fix from 2026-08-13) because this file is applied
# AFTER the --from-file step in deploy_financial_services, silently reverting
# the fix on every full deploy-app.sh run. Do not re-add an embedded copy.
# T-5.4 (mở rộng sang OpenStack): opa-server bên AWS đã đo thật cái giá của
# replicas:1 + failure_mode_allow:false (KET-QUA-KIEM-TRA.md T-5.4 — xoá pod
# duy nhất gây ~5.6s mất dịch vụ 100%, chuyển sang 3 replica + PDB loại bỏ
# hoàn toàn cửa sổ đó khi mất 1 pod đơn lẻ). OPA bên OpenStack (phục vụ
# core-banking/account-service/transaction-service qua zta/crosscloud/allow)
# là cùng một kiến trúc PDP tập trung fail-closed, cùng rủi ro F10 — áp dụng
# cùng fix để nhất quán, không đo lại riêng (kết luận suy ra hợp lý từ cùng
# cấu hình OPA, cùng failure_mode_allow:false).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opa-server
  namespace: financial
  labels:
    app: opa
spec:
  replicas: 3
  selector:
    matchLabels:
      app: opa
  template:
    metadata:
      labels:
        app: opa
      annotations:
        sidecar.istio.io/inject: "false"  # PDP for ext_authz, called by other sidecars' filters directly — not in migration scope
    spec:
      serviceAccountName: opa
      containers:
        - name: opa
          # Pinned 2026-09-05 from the digest actually running (was latest-envoy, a floating tag — see KET-QUA-KIEM-TRA.md T-0.5).
          image: openpolicyagent/opa@sha256:1792991ca9646526b8c95c59cbb525ce33bf78458800182d78f6fa884d5ec517
          args:
            - "run"
            - "--server"
            - "--addr=0.0.0.0:8181"
            - "--config-file=/etc/opa/opa-config.yaml"
            - "--ignore=.*"
            - "/policies"
          ports:
            - name: http
              containerPort: 8181
            - name: grpc-authz
              containerPort: 9191
          volumeMounts:
            - name: opa-config
              mountPath: /etc/opa
              readOnly: true
            - name: opa-policies
              mountPath: /policies
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: opa-config
          configMap:
            name: opa-config
        - name: opa-policies
          configMap:
            name: opa-policies
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: opa-server
  namespace: financial
  labels:
    app: opa
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: opa
---
apiVersion: v1
kind: Service
metadata:
  name: opa-service
  namespace: financial
  labels:
    app: opa
spec:
  type: ClusterIP
  selector:
    app: opa
  ports:
    - name: http
      port: 8181
      targetPort: 8181
    - name: grpc-authz
      port: 9191
      targetPort: 9191
# envoy-config ConfigMap used to be embedded here too — an incomplete,
# stale copy missing outbound_listener/cross-service STATIC clusters/the
# failure_mode_allow: false assertion that the real, currently-relied-upon
# config (envoy/configmap.yaml, applied to BOTH clusters by
# scripts/deploy-security-stack.sh's deploy_step_5_envoy) already has.
# Deleted so there is exactly one source of truth for both clouds — do not
# re-add an embedded copy here.
