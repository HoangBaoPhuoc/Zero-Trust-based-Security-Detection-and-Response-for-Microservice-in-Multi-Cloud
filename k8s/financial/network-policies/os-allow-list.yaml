apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: os-financial-allow-baseline
  namespace: financial
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # T-3.1 (2026-09-05): rule namespace-wide "financial -> financial" (mọi
    # port 15006/8080/9191/5432/6379) đã bị xoá — thay bằng NetworkPolicy
    # pod-level riêng cho từng đích trong os-pod-segmentation.yaml, đúng ma
    # trận traffic thật (T-1.1): core-banking -> account-service/
    # transaction-service, account-service -> postgres-accounts,
    # transaction-service -> postgres-txn. Xem chi tiết + lý do trong file đó.
    # Cross-cloud: AWS K3s nodes and pod subnets (via MASQUERADE on workers)
    # 15006=Envoy mTLS inbound, 8080=plain HTTP (metrics, health checks)
    - from:
        - ipBlock:
            cidr: 10.10.1.0/24
        - ipBlock:
            cidr: 10.10.0.0/24
        - ipBlock:
            cidr: 10.200.200.0/24
        - ipBlock:
            cidr: 192.168.101.0/24
        # NodePort traffic forwarded cross-node (externalTrafficPolicy:
        # Cluster, the k8s default) gets SNAT'd by kube-proxy to the pod
        # network CIDR before crossing to the node that actually runs the
        # backend pod — standard, unavoidable k8s behavior, not specific to
        # this project. Without this rule, ANY cross-node NodePort call
        # (same-cluster same-subnet included, e.g. os-k3s-master calling a
        # pod on os-k3s-worker-2) gets refused by kube-router's netpol
        # enforcement, since the masqueraded source matches no other rule
        # here (confirmed via repro: host-namespace curl to another node's
        # pod IP failed identically to the cross-cloud case — this was never
        # actually cross-cloud-specific).
        - ipBlock:
            cidr: 10.42.0.0/16
      ports:
        - port: 15006
          protocol: TCP
        - port: 8080
          protocol: TCP
        # opa-service:8181/health (security-healthcheck, namespace spire).
        # Added alongside the namespaceSelector:spire rule below because this
        # ipBlock-based rule is the one already proven to be enforced by k3s's
        # embedded netpol controller for cross-node pod-CIDR traffic on this
        # cluster (see the cross-node NodePort note above); a brand-new
        # namespaceSelector match may need a resync to materialize.
        - port: 8181
          protocol: TCP
    # Prometheus (monitoring namespace) scraping /metrics on port 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8080
          protocol: TCP
        - port: 15006
          protocol: TCP
    # k8s/security-monitoring/healthcheck-cronjob.yaml (namespace spire) calls
    # opa-service:8181/health directly to verify OPA's REST API is reachable.
    # Same gap as AWS's aws-allow-list.yaml (found there 2026-08-24) but never
    # mirrored to this file: the 10.42.0.0/16 rule above only opens 15006/8080,
    # not 8181, so every run of security-healthcheck on OpenStack reports
    # opa_unreachable even though opa-server itself is healthy.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: spire
      ports:
        - port: 8181
          protocol: TCP
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Intra-cluster: OS services talk to each other
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: financial
      ports:
        - port: 8080
          protocol: TCP
        - port: 5432
          protocol: TCP
        - port: 9191
          protocol: TCP
        - port: 6379
          protocol: TCP
    # Loki push: deployer bridge (10.10.10.1:13099 → socat → kubectl pf → Loki on AWS)
    - to:
        - ipBlock:
            cidr: 10.10.10.1/32
      ports:
        - port: 13099
          protocol: TCP
    # SPIRE server on AWS (NodePort 30900 on master)
    - to:
        - ipBlock:
            cidr: 10.10.1.10/32
      ports:
        - port: 30900
          protocol: TCP
    # Istio (Phase 6, OpenStack) — istio-proxy sidecar needs istiod for CA
    # (cert signing) + xDS config, both served on 15012. Same fix as the AWS
    # side's plg-stack→vault NetworkPolicy gap: this must exist before any
    # pod with restricted egress starts, or its sidecar can't fetch its cert.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
      ports:
        - port: 15012
          protocol: TCP
