apiVersion: v1
kind: ServiceAccount
metadata:
  name: core-banking
  namespace: financial
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: account-service
  namespace: financial
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: transaction-service
  namespace: financial
---
# core-banking: exposed via NodePort 30080 so AWS cluster can reach it cross-cloud
apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-banking
  namespace: financial
  labels:
    app: core-banking
    cloud: openstack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: core-banking
  template:
    metadata:
      labels:
        app: core-banking
        cloud: openstack
      annotations:
        spiffe.io/spiffeid: "spiffe://ztlab.local/openstack/core-banking"
        # Istio (Phase 6 batch 4, OpenStack): migrated. NodePort 30080 (used
        # by payment-service cross-cloud, see k8s/financial/istio-policies.yaml)
        # keeps its number but now targets istio-proxy's transparent
        # interception on 8080 instead of the removed hand-rolled envoy's
        # 15006 — see the Service below.
        sidecar.istio.io/inject: "true"
        sidecar.istio.io/userVolume: '[{"name":"spire-workload-socket","hostPath":{"path":"/run/spire/sockets/agent.sock","type":"Socket"}}]'
        sidecar.istio.io/userVolumeMount: '[{"name":"spire-workload-socket","mountPath":"/var/run/secrets/workload-spiffe-uds/socket"}]'
    spec:
      serviceAccountName: core-banking
      # T-1.5: core-banking verifies fraud-detection's verdict signature via
      # the SPIRE trust bundle instead of a shared HMAC secret (see
      # fraud-detection's Deployment in aws-services.yaml for why this needs
      # its own file-writer sidecar rather than a Workload API client lib).
      initContainers:
        - name: svid-init
          image: ghcr.io/spiffe/spire-agent:1.9.4
          command: ["/opt/spire/bin/spire-agent", "api", "fetch", "x509",
                    "-socketPath", "/run/spire/sockets/agent.sock", "-write", "/svid"]
          volumeMounts:
            - name: spire-socket
              mountPath: /run/spire/sockets
            - name: svid
              mountPath: /svid
      containers:
        - name: core-banking
          image: ztlab/core-banking:1.0.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "exec python -m uvicorn main:app --host 0.0.0.0 --port 8080"]
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: MAX_ALLOWED_FRAUD_SCORE
              value: "74"
            - name: CLOUD_PROVIDER
              value: "openstack"
            - name: ACCOUNT_SERVICE_URL
              value: "http://account-service.financial.svc.cluster.local:8080"
            - name: TRANSACTION_SERVICE_URL
              value: "http://transaction-service.financial.svc.cluster.local:8080"
          volumeMounts:
            - name: svid
              mountPath: /svid
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      # No periodic refresh sidecar -- see the long comment on this exact
      # point in fraud-detection's Deployment (aws-services.yaml): two
      # different approaches to a fetch-and-exit refresh sidecar both zeroed
      # out the Service's endpoints on a live test there. svid-init above
      # only fetches once at pod start; the trust bundle it writes is also
      # what's used to verify fraud-detection's SVID (bundle.0.pem), and it
      # will go stale on the same ~1h timeline. Known gap, see
      # KET-QUA-KIEM-TRA.md T-1.5.
      volumes:
        - name: spire-socket
          hostPath:
            path: /run/spire/sockets
            type: Directory
        - name: svid
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: core-banking
  namespace: financial
spec:
  type: NodePort
  selector:
    app: core-banking
  ports:
    - name: envoy
      port: 15006
      targetPort: 8080
      nodePort: 30080
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30084
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-service
  namespace: financial
  labels:
    app: account-service
    cloud: openstack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: account-service
  template:
    metadata:
      labels:
        app: account-service
        cloud: openstack
      annotations:
        spiffe.io/spiffeid: "spiffe://ztlab.local/openstack/account-service"
        sidecar.istio.io/inject: "true"
        sidecar.istio.io/userVolume: '[{"name":"spire-workload-socket","hostPath":{"path":"/run/spire/sockets/agent.sock","type":"Socket"}}]'
        sidecar.istio.io/userVolumeMount: '[{"name":"spire-workload-socket","mountPath":"/var/run/secrets/workload-spiffe-uds/socket"}]'
    spec:
      serviceAccountName: account-service
      containers:
        - name: account-service
          image: ztlab/account-service:1.0.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "until python3 -c \"import socket,sys; s=socket.socket(); s.settimeout(2); s.connect(('postgres-accounts.financial.svc.cluster.local', 5432)); s.close()\" 2>/dev/null; do echo 'waiting for postgres-accounts...'; sleep 2; done && exec python -m uvicorn main:app --host 0.0.0.0 --port 8080"]
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: ACCOUNTS_DB_HOST
              value: "postgres-accounts.financial.svc.cluster.local"
            - name: ACCOUNTS_DB_PORT
              value: "5432"
            - name: ACCOUNTS_DB_NAME
              value: "accounts_db"
            - name: ACCOUNTS_DB_USER
              value: "accounts_user"
            - name: ACCOUNTS_DB_PASS
              value: "accounts_pass"
            - name: CLOUD_PROVIDER
              value: "openstack"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: account-service
  namespace: financial
spec:
  type: NodePort
  selector:
    app: account-service
  ports:
    - name: envoy
      port: 15006
      targetPort: 8080
      nodePort: 30082
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30086
---
