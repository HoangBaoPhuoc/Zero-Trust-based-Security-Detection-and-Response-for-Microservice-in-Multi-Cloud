apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-gateway
  namespace: financial
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: payment-service
  namespace: financial
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fraud-detection
  namespace: financial
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: notification-service
  namespace: financial
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: financial
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
      annotations:
        spiffe.io/spiffeid: "spiffe://ztlab.local/aws/api-gateway"
        # Istio (Phase 6): migrated — hand-rolled Envoy removed, istio-proxy
        # takes over. SPIRE stays the cert source via the Workload API socket
        # (see notification-service comment for the full mechanism).
        sidecar.istio.io/inject: "true"
        sidecar.istio.io/userVolume: '[{"name":"spire-workload-socket","hostPath":{"path":"/run/spire/sockets/agent.sock","type":"Socket"}}]'
        sidecar.istio.io/userVolumeMount: '[{"name":"spire-workload-socket","mountPath":"/var/run/secrets/workload-spiffe-uds/socket"}]'
        # Phát hiện 2026-09-05 (KET-QUA-KIEM-TRA.md T-1.2): main.py gọi Keycloak
        # ngay trong FastAPI startup event, nhưng istio-proxy đôi khi chưa sẵn
        # sàng route egress tại đúng thời điểm đó -> "Connection refused" ->
        # _jwks_keys rỗng -> mọi request cần JWT bị 503 tới khi vòng lặp retry
        # 300s tự chạy lại. ĐÃ THỬ annotation chuẩn của Istio
        # (`proxy.istio.io/config: holdApplicationUntilProxyStarts`) — bị revert
        # ngay: gây istio-proxy tự PostStartHook fail/crash-loop trên bản Istio
        # 1.22.3 + cách mount socket SPIRE qua userVolume ở đây (không tương
        # thích), pod mới không bao giờ Ready. Chưa có fix an toàn — ghi nhận
        # là known issue, xem KET-QUA-KIEM-TRA.md.
    spec:
      serviceAccountName: api-gateway
      volumes:
        - name: patch-api-gateway
          configMap:
            name: patch-api-gateway
      containers:
        - name: api-gateway
          image: ztlab/api-gateway:1.0.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "exec python -m uvicorn main:app --host 0.0.0.0 --port 8080"]
          ports:
            - containerPort: 8080
              name: http
          env:
            # Istio intercepts this transparently and applies mTLS since
            # payment-service is also mesh-managed — no more local envoy
            # path router at 127.0.0.1:15001.
            - name: PAYMENT_SERVICE_URL
              value: "http://payment-service.financial.svc.cluster.local:8080"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: password
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@redis.financial.svc.cluster.local:6379/0"
            - name: IP_BLOCK_ENABLED
              value: "true"
            # T-1.4: trước đây rỗng -> _decode_jwt() tắt verify_aud, token phát
            # cho BẤT KỲ client nào trong realm ztlab đều dùng được ở đây. Giờ
            # bắt buộc đúng audience "api-gateway" — khớp Audience protocol
            # mapper vừa thêm vào client "web-portal" (luồng đăng nhập thật)
            # và "api-gateway" (client dùng cho gọi API/test trực tiếp).
            - name: JWT_AUDIENCE
              value: "api-gateway"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: patch-api-gateway
              mountPath: /app/main.py
              subPath: main.py
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: financial
spec:
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 8080
      # Istio intercepts transparently — Service targets the real app port.
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: financial
  labels:
    app: payment-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
      annotations:
        spiffe.io/spiffeid: "spiffe://ztlab.local/aws/payment-service"
        sidecar.istio.io/inject: "true"
        sidecar.istio.io/userVolume: '[{"name":"spire-workload-socket","hostPath":{"path":"/run/spire/sockets/agent.sock","type":"Socket"}}]'
        sidecar.istio.io/userVolumeMount: '[{"name":"spire-workload-socket","mountPath":"/var/run/secrets/workload-spiffe-uds/socket"}]'
    spec:
      serviceAccountName: payment-service
      volumes:
        - name: patch-payment-service
          configMap:
            name: patch-payment-service
        - name: patch-shared
          configMap:
            name: patch-shared
      containers:
        - name: payment-service
          image: ztlab/payment-service:1.0.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "exec python -m uvicorn main:app --host 0.0.0.0 --port 8080"]
          volumeMounts:
            - name: patch-payment-service
              mountPath: /app/main.py
              subPath: main.py
            - name: patch-shared
              mountPath: /app/shared/posture.py
              subPath: posture.py
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: FRAUD_SERVICE_URL
              value: "http://fraud-detection.financial.svc.cluster.local:8080"
            # core-banking is cross-cloud (OpenStack), not yet Istio-migrated
            # — reached via ServiceEntry+DestinationRule
            # (istio-cross-cloud-core-banking) so Istio still applies
            # SPIRE-sourced mTLS to this external NodePort, same as before.
            # core-banking-openstack is a selector-less Service + manually
            # managed Endpoints (istio-policies.yaml) giving a stable
            # internal DNS name to the OpenStack NodePort — CoreDNS resolves
            # it natively, Istio applies ISTIO_MUTUAL to it like any other
            # in-mesh destination.
            - name: CORE_BANKING_URL
              value: "http://core-banking-openstack.financial.svc.cluster.local:30080"
            - name: MAX_SINGLE_TXN_VND
              value: "500000000"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: financial
spec:
  selector:
    app: payment-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-detection
  namespace: financial
  labels:
    app: fraud-detection
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fraud-detection
  template:
    metadata:
      labels:
        app: fraud-detection
      annotations:
        spiffe.io/spiffeid: "spiffe://ztlab.local/aws/fraud-detection"
        sidecar.istio.io/inject: "true"
        sidecar.istio.io/userVolume: '[{"name":"spire-workload-socket","hostPath":{"path":"/run/spire/sockets/agent.sock","type":"Socket"}}]'
        sidecar.istio.io/userVolumeMount: '[{"name":"spire-workload-socket","mountPath":"/var/run/secrets/workload-spiffe-uds/socket"}]'
    spec:
      serviceAccountName: fraud-detection
      # T-1.5: fraud-detection signs the fraud verdict with its own SPIRE
      # X.509-SVID private key (shared/svid_sign.py) instead of a shared HMAC
      # secret. istio-proxy already has the Workload API socket via the
      # sidecar.istio.io/userVolume annotation above, but that mount is
      # istio-proxy-only -- the app container needs its own path to the SVID
      # material. No pyspiffe on PyPI (checked 2026-09-05) to call the
      # Workload API gRPC directly from Python, so a small sidecar running
      # the actual spire-agent binary (same image/version as the node
      # DaemonSet) writes cert/key/bundle to a shared emptyDir on a loop --
      # the standard SPIRE "file writer" pattern. initContainer does the
      # first fetch so the app never starts without a valid SVID already on
      # disk (avoids the T-1.2-style startup race).
      initContainers:
        - name: svid-init
          image: ghcr.io/spiffe/spire-agent:1.9.4
          command: ["/opt/spire/bin/spire-agent", "api", "fetch", "x509",
                    "-socketPath", "/run/spire/sockets/agent.sock", "-write", "/svid"]
          volumeMounts:
            - name: spire-socket
              mountPath: /run/spire/sockets
            - name: svid
              mountPath: /svid
        # Periodic refresh sidecar REMOVED for now (2026-09-05) -- two
        # attempts both caused a real outage (Service endpoints went to zero
        # because the fetch-and-exit container's cycling left the Pod
        # Ready=False, tried both as a regular container and as a
        # restartPolicy:Always "native sidecar" init container -- neither
        # kept the Pod Ready on this k3s v1.29.3 build). Reverted both times
        # within minutes; confirmed via `kubectl get endpoints
        # fraud-detection` going empty and back. For now: svid-init above
        # fetches ONCE at pod start only -- the SVID is valid 1h (see
        # default_x509_svid_ttl) and is NOT refreshed after that, so a
        # fraud-detection pod running longer than ~1h will start signing
        # verdicts with an expired cert (core-banking's verify() will then
        # reject them as cert_expired_or_not_yet_valid -- fails CLOSED, not
        # silently insecure, but real payments would break). Known gap, see
        # KET-QUA-KIEM-TRA.md T-1.5 -- needs a different mechanism (a
        # readinessProbe-gated approach, or a custom image with a shell)
        # before this can run unattended past 1h.
      containers:
        - name: fraud-detection
          image: ztlab/fraud-detection:1.0.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "exec python -m uvicorn main:app --host 0.0.0.0 --port 8080"]
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: password
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@redis.financial.svc.cluster.local:6379/0"
            - name: FRAUD_VELOCITY_WINDOW_SECONDS
              value: "900"
          volumeMounts:
            - name: svid
              mountPath: /svid
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: spire-socket
          hostPath:
            path: /run/spire/sockets
            type: Directory
        - name: svid
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: fraud-detection
  namespace: financial
spec:
  selector:
    app: fraud-detection
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: financial
  labels:
    app: notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
      annotations:
        spiffe.io/spiffeid: "spiffe://ztlab.local/aws/notification-service"
        # Istio canary (Phase 6): hand-rolled Envoy sidecar removed below,
        # istio-proxy takes over mTLS + inbound interception. SPIRE stays the
        # cert source (not Istio's own Citadel): pilot-agent (inside
        # istio-proxy) checks for a Workload API socket at the well-known
        # path /var/run/secrets/workload-spiffe-uds/socket BEFORE starting
        # Envoy — if found, it uses that as the SDS source instead of
        # spinning up its own local Citadel-backed SDS server (confirmed via
        # istio-proxy logs: "Workload SDS socket not found. Starting Istio
        # SDS Server" when this mount is absent). SPIRE's agent socket speaks
        # the Envoy SDS protocol natively and already serves secrets named
        # "default"/"ROOTCA" — the exact names istio-proxy requests — so the
        # SPIRE socket FILE (not just its directory) must be bind-mounted at
        # that exact path. An earlier EnvoyFilter approach (patching the
        # sds-grpc cluster) did NOT work — that only affects Envoy's own
        # xDS-delivered config, not pilot-agent's pre-Envoy startup check.
        sidecar.istio.io/inject: "true"
        sidecar.istio.io/userVolume: '[{"name":"spire-workload-socket","hostPath":{"path":"/run/spire/sockets/agent.sock","type":"Socket"}}]'
        sidecar.istio.io/userVolumeMount: '[{"name":"spire-workload-socket","mountPath":"/var/run/secrets/workload-spiffe-uds/socket"}]'
    spec:
      serviceAccountName: notification-service
      containers:
        - name: notification-service
          image: ztlab/notification-service:1.0.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "exec python -m uvicorn main:app --host 0.0.0.0 --port 8080"]
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: smtp-secret
                  key: host
                  optional: true
            - name: SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: smtp-secret
                  key: port
                  optional: true
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: smtp-secret
                  key: user
                  optional: true
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: smtp-secret
                  key: password
                  optional: true
            - name: SMTP_FROM
              valueFrom:
                secretKeyRef:
                  name: smtp-secret
                  key: from
                  optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: financial
spec:
  selector:
    app: notification-service
  ports:
    - name: http
      port: 8080
      # Istio intercepts traffic transparently via iptables — Service targets
      # the real app port now, not the old hand-rolled Envoy's 15006.
      targetPort: 8080
