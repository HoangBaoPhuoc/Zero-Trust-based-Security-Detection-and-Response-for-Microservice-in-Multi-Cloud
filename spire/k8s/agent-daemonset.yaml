apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: spire-agent
  namespace: spire
  labels:
    app: spire-agent
spec:
  selector:
    matchLabels:
      app: spire-agent
  template:
    metadata:
      labels:
        app: spire-agent
    spec:
      hostPID: true
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: spire-agent
      tolerations:
        - operator: Exists
      initContainers:
        - name: wait-for-server
          image: cgr.dev/chainguard/wait-for-it:latest
          args:
            - "spire-server.spire.svc.cluster.local:8081"
            - "--"
            - "echo"
            - "SPIRE Server ready"
        # Istio's SPIRE integration (SPIFFE CSI driver + istio-agent's SDS
        # client) hardcodes the expected Workload API socket filename as
        # "socket" — not configurable. This project's agent.conf names it
        # "agent.sock" (matches every hand-rolled Envoy sidecar's pipe
        # address across k8s/financial/*.yaml, which must not change).
        # `ln -s` doesn't need the target to exist yet, so this can run
        # before spire-agent starts; the symlink just resolves once it does.
        - name: alias-socket-for-istio
          image: busybox:1.36
          command: ["sh", "-c", "ln -sfn agent.sock /run/spire/sockets/socket"]
          volumeMounts:
            - name: spire-sockets
              mountPath: /run/spire/sockets
      containers:
        - name: spire-agent
          image: ghcr.io/spiffe/spire-agent:1.9.4
          args:
            - "-config"
            - "/run/spire/config/agent.conf"
          volumeMounts:
            - name: spire-config
              mountPath: /run/spire/config
              readOnly: true
            - name: spire-sockets
              mountPath: /run/spire/sockets
            - name: spire-token
              mountPath: /var/run/secrets/tokens
            # T-2.1: bỏ insecure_bootstrap/skip_kubelet_verification — 2 mount
            # dưới đây là những gì agent.conf giờ cần để tự xác minh (xem
            # spire/agent/{aws,os}-agent.conf).
            - name: spire-bundle
              mountPath: /run/spire/bundle
              readOnly: true
            - name: kubelet-ca
              mountPath: /run/spire/kubelet-ca/server-ca.crt
              readOnly: true
      volumes:
        - name: spire-config
          configMap:
            name: spire-agent-config
            items:
              - key: agent.conf
                path: agent.conf
        - name: spire-sockets
          hostPath:
            path: /run/spire/sockets
            type: DirectoryOrCreate
        - name: spire-token
          projected:
            sources:
              - serviceAccountToken:
                  path: spire-agent
                  expirationSeconds: 7200
                  audience: spire-server
        # Root CA của hệ thống (spire/root-ca/ca.crt) — agent dùng để verify
        # server khi bootstrap thay vì insecure_bootstrap. Cùng 1 ConfigMap,
        # cùng nội dung, cho cả 2 cluster (server.conf của cả 2 cluster dùng
        # chung UpstreamAuthority này — xác nhận 2026-09-05).
        - name: spire-bundle
          configMap:
            name: spire-bundle
            items:
              - key: ca.crt
                path: bootstrap.crt
        # CA nội bộ của chính k3s trên node này — ký serving cert của kubelet
        # (xác nhận 2026-09-05, cả AWS lẫn OpenStack). Có sẵn trên mọi node,
        # không cần phân phối gì thêm.
        - name: kubelet-ca
          hostPath:
            path: /var/lib/rancher/k3s/agent/server-ca.crt
            type: File

