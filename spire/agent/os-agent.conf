agent {
	data_dir      = "/run/spire"
	log_level     = "INFO"
	trust_domain  = "ztlab.local"
	# T-2.1: xem giải thích đầy đủ trong spire/agent/aws-agent.conf — cùng root
	# CA (spire/root-ca/ca.crt), mount qua ConfigMap "spire-bundle".
	trust_bundle_path = "/run/spire/bundle/bootstrap.crt"
	server_address = "spire-server.spire.svc.cluster.local"
	server_port   = "8081"
	socket_path   = "/run/spire/sockets/agent.sock"
}

plugins {
	NodeAttestor "k8s_psat" {
		plugin_data {
			cluster = "os-k3s"
		}
	}

	KeyManager "memory" { plugin_data {} }

	WorkloadAttestor "k8s" {
		plugin_data {
			# T-2.1: xem giải thích đầy đủ trong aws-agent.conf — xác nhận
			# 2026-09-05 trên os_k3s_worker_1: cùng đường dẫn CA nội bộ k3s.
			kubelet_ca_path = "/run/spire/kubelet-ca/server-ca.crt"
		}
	}
}
