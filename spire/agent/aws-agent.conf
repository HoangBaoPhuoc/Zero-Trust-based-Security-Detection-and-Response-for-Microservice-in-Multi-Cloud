agent {
	data_dir      = "/run/spire"
	log_level     = "INFO"
	trust_domain  = "ztlab.local"
	# T-2.1: trước đây insecure_bootstrap=true (trust-on-first-use, agent tin
	# server mà không xác minh gì ở lần bootstrap đầu tiên). Giờ agent tự xác
	# minh server bằng chính root CA của hệ thống (spire/root-ca/ca.crt — cùng
	# CA server dùng làm UpstreamAuthority, xác nhận 2026-09-05: khớp fingerprint
	# với `spire-server bundle show` thật) — mount qua ConfigMap "spire-bundle".
	trust_bundle_path = "/run/spire/bundle/bootstrap.crt"
	server_address = "spire-server.spire.svc.cluster.local"
	server_port   = "8081"
	socket_path   = "/run/spire/sockets/agent.sock"
}

plugins {
	NodeAttestor "k8s_psat" {
		plugin_data {
			cluster = "aws-k3s"
		}
	}

	KeyManager "memory" { plugin_data {} }

	WorkloadAttestor "k8s" {
		plugin_data {
			# T-2.1: trước đây skip_kubelet_verification=true (không xác minh
			# TLS của kubelet khi attest workload). k3s ký serving cert của
			# kubelet bằng chính CA nội bộ của cluster, sẵn có trên MỌI node
			# tại /var/lib/rancher/k3s/agent/server-ca.crt (xác nhận 2026-09-05,
			# cả AWS lẫn OpenStack) — không cần phân phối gì thêm, chỉ cần mount
			# hostPath.
			kubelet_ca_path = "/run/spire/kubelet-ca/server-ca.crt"
		}
	}
}
